<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Complaint</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            overflow: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            height: 64px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            background: #ffffff;

            border-bottom: 1px solid #e5e7eb;

            position: relative;
            z-index: 10;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
            letter-spacing: -0.2px;
        }


        /* =========================
           GOOGLE SHEET CONTAINER
        ========================= */

        .sheet-container {
            width: 100%;

            height: calc(100vh - 64px);

            background: #ffffff;

            overflow: hidden;
        }


        /* =========================
           IFRAME
        ========================= */

        .sheet-frame {
            width: 100%;
            height: 100%;

            border: none;

            display: block;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1024px) {

            .header {
                height: 58px;
                padding: 0 20px;
            }

            .title {
                font-size: 19px;
            }

            .sheet-container {
                height: calc(100vh - 58px);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                height: 52px;
                padding: 0 16px;
            }

            .title {
                font-size: 17px;
                font-weight: 600;
            }

            .sheet-container {
                height: calc(100vh - 52px);
            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 380px) {

            .header {
                height: 48px;
                padding: 0 14px;
            }

            .title {
                font-size: 16px;
            }

            .sheet-container {
                height: calc(100vh - 48px);
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <h1 class="title">
            Dashboard Complaint
        </h1>

    </header>


    <!-- =========================
         GOOGLE SHEET
    ========================= -->

    <main class="sheet-container">

        <iframe
            class="sheet-frame"
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQVpBhF4JHz-ygdhAsipyXYWIzBEXLp-0L9X8SkujaqudKEnIXnirAaKIoaISMJGHguwwJrU7s_qulF/pubhtml?gid=1376486950&amp;single=true&amp;widget=true&amp;headers=false"
            loading="lazy"
            title="Dashboard Complaint">
        </iframe>

    </main>


</body>

</html>
